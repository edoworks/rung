name: Governance Audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Rung governance audit
        run: |
          pip install -e .
          python3 -m rung --root . --json > audit.json
          SCORE=$(python3 -c "import json; print(json.load(open('audit.json'))['score'])")
          GRADE=$(python3 -c "import json; print(json.load(open('audit.json'))['grade'])")
          GATE=$(python3 -c "import json; print(json.load(open('audit.json'))['quality_gate'])")
          echo "Governance score: $SCORE/100, Grade: $GRADE, Gate: $GATE"
          if [ "$GATE" = "FAIL" ]; then echo "::error::Governance quality gate failed"; exit 1; fi
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: governance-audit
          path: audit.json