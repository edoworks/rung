name: Release Rung

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
      - run: python scripts/build_single_file.py --check

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-release.txt
      - name: Require a matching tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -c "import re, sys; sys.exit(0 if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', sys.argv[1]) else 1)" "$GITHUB_REF_NAME" || {
            echo "release tag must be strict vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          version="$(python -c 'import pathlib; print(next(line.split("=", 1)[1].strip().strip(chr(34)) for line in pathlib.Path("pyproject.toml").read_text().splitlines() if line.startswith("version =")))')"
          test "${GITHUB_REF_NAME#v}" = "$version" || {
            echo "tag version does not match pyproject.toml" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "release tag must bind the exact current origin/main revision" >&2
            exit 1
          }
          test -f "docs/releases/v${version}.md" || {
            echo "version-matched release notes are missing" >&2
            exit 1
          }
      - run: python scripts/validate_release.py --dist dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rung-release-artifacts
          path: dist/**

  release-gate:
    if: always()
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require complete release validation
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$TEST_RESULT" = success && test "$BUILD_RESULT" = success

  attest:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rung-release-artifacts
          path: dist/
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/**
  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: attest
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/edoworks/rung/releases
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Recheck protected release identity
        run: |
          remote_tag="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | cut -f1)"
          test -n "$remote_tag" || {
            echo "release tag must be annotated" >&2
            exit 1
          }
          test "$remote_tag" = "$GITHUB_SHA" || {
            echo "remote release tag moved after build" >&2
            exit 1
          }
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "reviewed main moved after release build" >&2
            exit 1
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rung-release-artifacts
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/**
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [attest, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rung-audit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rung-release-artifacts
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/packages/
