[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rung-audit"
version = "0.3.0"
description = "Assess observable repository evidence for responsible AI coding-agent authority"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Foculoom LLC"}]
keywords = ["ai", "agent", "governance", "audit", "cli", "agents-md", "developer-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://rung.edoworks.com/"
Documentation = "https://github.com/edoworks/rung#readme"
Repository = "https://github.com/edoworks/rung"
Issues = "https://github.com/edoworks/rung/issues"
Changelog = "https://github.com/edoworks/rung/releases"

[project.scripts]
rung = "rung.cli:main"

[tool.setuptools.packages.find]
include = ["rung*"]
